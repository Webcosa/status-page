# La page de statut de Webcosa.
#
# Elle REMPLACE « Static Site CI » (site.yml), qui reste dans le dépôt mais
# est désactivé côté GitHub. Les deux publient sur `gh-pages` : les laisser
# tourner ensemble ferait alterner la page de Webcosa et celle d'Upptime au
# gré des exécutions, ce qui est le genre de panne qu'on met des heures à
# comprendre parce que la page « remarche » à chaque fois qu'on la recharge.
#
# On ne supprime pas site.yml : `update-template` le réécrirait, et le
# fichier reviendrait. Le désactiver côté GitHub tient, lui, quoi qu'il
# arrive au fichier.

name: Page Webcosa

on:
  # PAS après chaque mesure, et c'est une correction, pas un compromis.
  #
  # On reconstruisait toutes les 5 minutes. Chaque publication sur
  # `gh-pages` déclenche un « pages build and deployment » qui met 3 à
  # 5 minutes : à cette cadence ils se chevauchaient, s'annulaient l'un
  # l'autre, et la file a fini par rester bloquée en `deployment_queued`
  # jusqu'au dépassement de délai. Résultat concret : la page ne se
  # mettait plus à jour du tout.
  #
  # La fraîcheur ne vient donc plus de la reconstruction mais du
  # navigateur : la page relit `history/summary.json` sur raw.github
  # (CORS ouvert, cache de 5 minutes — exactement la cadence des sondes)
  # à chaque ouverture. Reconstruire ne sert plus qu'aux barres
  # journalières, qui par définition changent une fois par jour.
  push:
    branches: [master]
    paths:
      - "scripts/page.mjs"
      - ".github/workflows/page-webcosa.yml"
      # Le récapitulatif des mesures, et c'est le déclencheur qui manquait.
      #
      # Upptime n'écrit dans history/ QUE si quelque chose change — il
      # journalise « Skipping commit, status is up » le reste du temps. Ce
      # chemin ne se déclenche donc pas toutes les 5 minutes : il se
      # déclenche exactement quand la page a quelque chose de nouveau à
      # dire, c'est-à-dire une panne, un rétablissement, ou un service
      # ajouté.
      #
      # Sans lui, ajouter un composant ne se voyait qu'à la reconstruction
      # de nuit : les trois sondes de santé étaient mesurées et publiées
      # dans les données, mais absentes de la page pendant des heures.
      - "history/summary.json"
  # Une fois par nuit : c'est le rythme des barres journalières, et ça
  # laisse la file de déploiement de Pages entièrement libre.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Deux exécutions concurrentes déploieraient deux versions dans un ordre
# indéterminé — donc potentiellement l'ancienne en dernier.
concurrency:
  group: page-webcosa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publier:
    name: Construire et publier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # `master` EXPLICITEMENT, et c'est tout l'intérêt de la ligne.
          # Sur un évènement `workflow_run`, la révision par défaut est
          # celle qui a DÉCLENCHÉ Uptime CI — donc l'état du dépôt AVANT
          # que celui-ci n'écrive sa mesure dans `history/`. La page se
          # serait construite sur les chiffres du cycle précédent, à
          # chaque fois, sans que rien ne le signale : elle aurait
          # simplement affiché une heure de mesure vieille de cinq
          # minutes de plus que la réalité.
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Aucune dépendance : le script n'utilise que `node:fs` et `Intl`.
      # Rien à installer, donc rien qui puisse casser à l'installation.
      - name: Construire la page
        run: node scripts/page.mjs

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: site-webcosa
          # `gh-pages` est un ARTEFACT, pas un historique. Sans orphelin,
          # une reconstruction toutes les 5 minutes y empilerait ~300
          # commits par jour pour une page de 40 Ko — quelques gigaoctets
          # par an, pour zéro information qu'on ne trouve pas déjà dans
          # `history/`.
          force_orphan: true
          user_name: "webcosa-bot"
          user_email: "bot@webcosa.com"
          commit_message: "page de statut"
