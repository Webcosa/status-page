# Configuration principale
owner: webcosa # Mettez votre pseudo GitHub ici
repo: status-page # Mettez le nom de votre dépôt GitHub ici (ex: status-page)

sites:
  # ── La plateforme ────────────────────────────────────────────────────
  # Les trois dernières interrogent /api/sante, qui EXERCE la dépendance
  # au lieu de constater que Vercel a servi du HTML. Sans elles, Supabase
  # pouvait être à terre pendant que cette page affichait « Opérationnel ».
  - name: Espace client
    url: https://cms.webcosa.com
  - name: Base de données
    url: https://cms.webcosa.com/api/sante?c=base
  - name: Connexion
    url: https://cms.webcosa.com/api/sante?c=connexion
  - name: Rendu des sites
    url: https://cms.webcosa.com/api/sante?c=rendu

  # ── Les deux qui sortent par la porte d'entrée ───────────────────────
  # Les quatre au-dessus mesurent qu'un serveur répond, ou qu'une
  # dépendance répond. Aucune ne peut voir une page qui répond
  # PARFAITEMENT et ne marche pas — c'est ce qui est arrivé le 6 août : la
  # vitrine a passé des heures sans un clic possible, en rendant 200 en
  # 40 ms avec un HTML complet, pendant que ces moniteurs étaient au vert
  # et avaient raison de l'être.
  #
  # Ces deux-là récupèrent une vraie page et vérifient qu'elle est
  # utilisable : corps non vide, et surtout cohérence entre la politique
  # de sécurité et le HTML — un nonce exigé que le corps ne porte pas fait
  # bloquer par le navigateur TOUS les scripts en ligne, donc l'amorce
  # d'hydratation. « Sites clients » va en plus chercher la feuille de
  # style du thème à l'adresse écrite dans la page.
  - name: Sites clients
    url: https://cms.webcosa.com/api/sante?c=site
  - name: Écran de connexion
    url: https://cms.webcosa.com/api/sante?c=ecran

  # ── Nos sites ────────────────────────────────────────────────────────
  - name: Site vitrine
    url: https://www.webcosa.com
  - name: Documentation
    url: https://dev.webcosa.com
  - name: Store
    url: https://store.webcosa.com

status-website:
  cname: status.webcosa.com
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Webcosa Status
  introTitle: "**Statut des services Webcosa**"
  introMessage: "Cette page affiche en temps réel l'état de nos services, sites et API. Elle est entièrement automatisée."
  navbar:
    - title: Statut
      href: /
    - title: Webcosa Website
      href: https://webcosa.com
